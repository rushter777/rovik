# Two-container Rovik: proxy (:8788) + Laya CPU sidecar (:8777).
#
# UNTESTED (2026-11-28) — authored on a Docker-less mac. See docs/docker.md.
# Agent harnesses (e.g. a Hermes container on the same network) point at:
#     http://rovik:8788/v1

services:

  rovik-sidecar:
    build: .
    image: rovik:latest
    command: python -m rovik sidecar
    restart: unless-stopped
    environment:
      ROVIK_SKIP_PREFLIGHT: "1"          # container can't see the host LLM
      LAYA_SIDECAR_HOST: 0.0.0.0          # loopback bind = unreachable in Docker
      LAYA_SIDECAR_PORT: "8777"
      LAYA_MODEL_PATH: /checkpoints/laya  # mount your real checkpoint dir below
    volumes:
      - ./checkpoints:/checkpoints:ro

  rovik:
    build: .
    image: rovik:latest
    command: python -m rovik proxy
    restart: unless-stopped
    depends_on:
      - rovik-sidecar
    ports:
      - "8788:8788"                        # optional: expose to host
    environment:
      ROVIK_SKIP_PREFLIGHT: "1"
      ROVIK_PROXY_HOST: 0.0.0.0
      ROVIK_PROXY_PORT: "8788"
      # ---- routing targets (override every one for your machine) ----
      ROVIK_LOCAL_URL: http://host.docker.internal:8081/v1/chat/completions
      ROVIK_LOCAL_MODEL: local-8b
      # frontier escalation + thresholds + tags live in your private env file:
      ROVIK_ESC_URL: https://openrouter.ai/api/v1/chat/completions
      ROVIK_ESC_MODEL: z-ai/glm-5.3
      ROVIK_ESC_KEYNAME: OPENROUTER_API_KEY
      ROVIK_FALLBACK_ROUTE: local          # Laya/local failure never spends money
      LAYA_THRESH_HARD: "0.6"              # small local model => escalate sooner
      LAYA_THRESH_TOOLS: "0.5"
      LAYA_THRESH_VERIFY: "0.5"
      ROVIK_JUDGE_URL: http://rovik-sidecar:8777/predict
      ROVIK_LOG_DIR: /tmp/rovik
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; Docker Desktop defines it natively
    # env_file:
    #   - ./rovik.env                        # or keep everything explicit above