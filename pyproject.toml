[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rovik"
version = "0.2.0"
description = "Local-first AI model routing switch with a fine-tunable 400M decision classifier (Laya)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.142.4",
    "uvicorn>=0.40.0",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.31.1",
    "mlx-metal>=0.31.1",
    "numpy>=2.0.0",
]
train = [
    "torch>=2.2.0",
    "transformers>=4.48.0",
    "safetensors>=0.8.0",
    "numpy>=2.0.0",
]
dev = [
    "ruff>=0.8.0",
]
all = [
    "rovik[mlx,train]",
]

[project.scripts]
rovik = "rovik.cli:main"

[tool.setuptools.packages.find]
include = ["rovik*", "serving*", "pipeline*"]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
